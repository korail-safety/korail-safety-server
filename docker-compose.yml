# 로컬 개발용 PostgreSQL
# 실행: docker compose up -d   /   종료: docker compose down
services:
  db:
    image: postgres:16
    container_name: korail-safety-db
    environment:
      POSTGRES_USER: korail
      POSTGRES_PASSWORD: korail
      POSTGRES_DB: korail_safety
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korail -d korail_safety"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
